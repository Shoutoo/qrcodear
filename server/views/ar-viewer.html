<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="AR Viewer — {{MODEL_NAME}}" />
  <title>{{MODEL_NAME}} — Magic AR Edu</title>

  <!-- Tailwind CSS -->

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <!-- Quicksand Font -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">

      darkMode: "class",
      theme: {
        extend: {

            "secondary": "#705d00",
            "surface-bright": "#f4faff",
            "primary-fixed-dim": "#cdbdff",
            "secondary-fixed": "#ffe170",
            "on-primary-fixed-variant": "#4f00d0",
            "surface-container-low": "#e7f6ff",
            "surface-tint": "#6833ea",
            "on-primary-fixed": "#20005f",
            "on-secondary-container": "#6f5c00",
            "primary": "#632ce5",
            "on-background": "#0d1e25",
            "outline": "#7a7487",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "surface-variant": "#d4e5ef",
            "primary-container": "#7c4dff",
            "secondary-container": "#fdd400",
            "on-tertiary": "#ffffff",
            "background": "#f4faff",
            "surface-dim": "#cbdde7",
            "on-secondary-fixed": "#221b00",
            "on-surface": "#0d1e25",
            "on-error": "#ffffff",
            "inverse-on-surface": "#e2f3fd",
            "tertiary-fixed-dim": "#00daf3",
            "inverse-primary": "#cdbdff",
            "tertiary-fixed": "#9cf0ff",
            "surface-container-lowest": "#ffffff",
            "on-surface-variant": "#494455",
            "on-primary": "#ffffff",
            "on-secondary": "#ffffff",
            "primary-fixed": "#e8deff",
            "surface": "#f4faff",
            "surface-container-highest": "#d4e5ef",
            "on-tertiary-container": "#ebfcff",
            "on-tertiary-fixed": "#001f24",
            "on-secondary-fixed-variant": "#544600",
            "outline-variant": "#cac3d8",
            "tertiary-container": "#007e8d",
            "secondary-fixed-dim": "#e9c400",
            "on-primary-container": "#fcf6ff",
            "tertiary": "#00636f",
            "surface-container": "#dff1fb",
            "error": "#ba1a1a",
            "on-tertiary-fixed-variant": "#004f58",
            "inverse-surface": "#23333a",
            "surface-container-high": "#d9ebf5"
          },
          "fontFamily": {
            "button-text": ["Quicksand"],
            "display-lg": ["Quicksand"],
            "body-md": ["Quicksand"],
            "label-bold": ["Quicksand"],
            "headline-md": ["Quicksand"]

        }

  <!-- Google <model-viewer> (Markerless AR Engine) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background: #f4faff;
    }

    /* ── Model Viewer Container ────────────────────────────── */
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: #f4faff;
      --poster-color: transparent;
      z-index: 1;
    }

    /* ── Custom Floating AR Button ─────────────────────────── */
    .ar-custom-button {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #632ce5 0%, #7c4dff 100%);
      color: #ffffff;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 50px;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 24px rgba(99, 44, 229, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .ar-custom-button:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 12px 30px rgba(99, 44, 229, 0.5);
    }
    .ar-custom-button:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* ── Header Bar ────────────────────────────────────── */
    #header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 16px 20px 32px;
      background: linear-gradient(to bottom, rgba(244,250,255,0.95) 0%, rgba(244,250,255,0) 100%);
      display: flex; align-items: center; gap: 12px;
      z-index: 10;
      pointer-events: auto;
    }

    /* ── Loading Screen ────────────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 50; background: #f4faff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.6s ease; font-family: 'Quicksand', sans-serif;
    }
    #loading-screen.fade { opacity: 0; pointer-events: none; }
    #loading-screen.hidden { display: none; }
  </style>
</head>
<body>

<!-- ── Loading Screen ──────────────────────────────────────── -->
<div id="loading-screen">
  <div class="bg-primary-container p-4 rounded-2xl mb-2 animate-bounce">
    <span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">auto_fix_high</span>
  </div>
  <div class="font-display-lg text-2xl text-primary font-bold">Magic AR Edu</div>
  <div class="text-on-surface-variant font-medium">{{MODEL_NAME}}</div>
  <div class="w-48 h-2 bg-surface-container-high rounded-full overflow-hidden mt-4">
    <div class="h-full bg-primary rounded-full transition-all duration-300" id="ld-bar" style="width: 0%"></div>
  </div>
  <div class="text-sm font-bold text-outline mt-2" id="ld-status">Memuat model 3D ajaib...</div>
</div>

<!-- ── Google <model-viewer> (Markerless AR Engine) ────────── -->
<model-viewer
  id="viewer"
  src="{{MODEL_URL}}"
  ios-src="{{MODEL_USDZ_URL}}"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  shadow-intensity="1"
  ar-placement="floor"
  alt="{{MODEL_NAME}}"
  loading="eager"
  auto-rotate
>
  <button slot="ar-button" id="ar-button" class="ar-custom-button">
    <span class="material-symbols-outlined">view_in_ar</span> Lihat dalam AR
  </button>
</model-viewer>

<!-- ── UI Overlay ────────────────────────────────────────── -->
<div id="overlay">

  <!-- Header -->
  <div id="header">
    <div class="bg-primary-container p-2 rounded-lg flex-shrink-0">
      <span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">auto_fix_high</span>
    </div>
    <div>
      <h1 class="font-bold text-on-surface text-lg leading-tight">{{MODEL_NAME}}</h1>
      <p class="text-xs text-on-surface-variant font-medium">Magic AR Edu • {{UPLOAD_DATE}}</p>
    </div>
    <div class="ml-auto pointer-events-auto">
      <a class="bg-surface-container-highest text-on-surface font-bold text-xs px-4 py-2 rounded-full flex items-center gap-1 shadow-sm hover:bg-surface-dim transition-colors" href="/print/{{ASSET_ID}}" target="_blank">
        <span class="material-symbols-outlined text-sm">print</span> Cetak
      </a>
    </div>
  </div>

  <!-- SVG Line overlay -->
  <svg id="lines-svg" xmlns="http://www.w3.org/2000/svg"></svg>

  <!-- Annotation labels -->
  <div id="ann-wrap"></div>

  <!-- Marker found ring -->
  <div id="found-ring"></div>

  <!-- Instructions -->
  <div id="instructions" class="flex items-center gap-2">
    <span class="material-symbols-outlined text-primary">qr_code_scanner</span>
    Arahkan kamera ke <strong class="text-primary">Marker AR</strong>
  </div>

  <!-- Info Popup -->
  <div id="info-popup">
    <div class="flex items-center justify-between mb-4 border-b-2 border-surface-container-high pb-3">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">sell</span>
        <h2 id="popup-title" class="font-bold text-on-surface text-lg">Label</h2>
      </div>
      <button class="text-outline-variant hover:text-error hover:bg-error-container p-1 rounded transition-colors" onclick="closePopup()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <p id="popup-desc" class="text-on-surface-variant text-sm leading-relaxed font-medium mb-4">Deskripsi...</p>
    <p class="text-xs text-center text-outline font-bold">Tap di luar untuk menutup</p>
  </div>

  <!-- Large Magenta Title Overlay -->
  <div id="ar-title-banner" class="ar-title-text">
    {{MODEL_NAME}}
  </div>

  <!-- Footer bar -->
  <div id="footer-bar">
    <div class="status-indicator">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Mencari marker...</span>
    </div>
  </div>

</div>

<script type="application/json" id="annotations-data">
{{ANNOTATIONS_JSON}}
</script>

<script>
// ─── Data injected from server ──────────────────────────────
const ANNOTATIONS = JSON.parse(document.getElementById('annotations-data').textContent || '[]');

// ─── DOM References ─────────────────────────────────────────
const viewer    = document.getElementById('viewer');
const ldBar     = document.getElementById('ld-bar');
const ldStatus  = document.getElementById('ld-status');
const loadingLs = document.getElementById('loading-screen');

// ─── Loading Progress for <model-viewer> ────────────────────
if (viewer && ldBar && loadingLs) {
  viewer.addEventListener('progress', (e) => {
    const progress = Math.round(e.detail.totalProgress * 100);
    ldBar.style.width = progress + '%';
    if (ldStatus) ldStatus.textContent = `Memuat model 3D (${progress}%)...`;
  });

  const finishLoading = () => {
    ldBar.style.width = '100%';
    if (ldStatus) ldStatus.textContent = 'Siap!';
    setTimeout(() => {
      loadingLs.classList.add('fade');
      setTimeout(() => loadingLs.classList.add('hidden'), 600);
    }, 300);
  };

  viewer.addEventListener('load', finishLoading);
  // Fallback timeout in case load event already fired
  setTimeout(() => {
    if (!loadingLs.classList.contains('hidden')) finishLoading();
  }, 4000);
}

/* =========================================================================
 * LEGACY AR.JS ANNOTATION CODE (RESERVED FOR FASE 3 HOTSPOT CONVERSION)
 * =========================================================================
 *
 * const POS_PRESETS = {
 *   'top': { x: 0.00, y: 0.55, z: 0 },
 *   'right': { x: 0.32, y: 0.22, z: 0 },
 *   ...
 * };
 *
 * function showInfo(i) { ... }
 * function closePopup() { ... }
 *
 * ========================================================================= */
</script>
</body>
</html>
