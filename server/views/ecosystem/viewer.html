<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>{{ECOSYSTEM_NAME}} — AlamVerse AR & 3D Viewer</title>
  
  <!-- Tailwind CSS & Material Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

  <!-- Three.js Engine & MindAR.js Image Tracking for Cross-Device AR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <!-- Google <model-viewer> Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body { font-family: 'Quicksand', sans-serif; overflow: hidden; background-color: #f4faff; color: #0d1e25; }
    model-viewer { width: 100vw; height: 100vh; position: absolute; inset: 0; background: radial-gradient(circle at center, #ffffff 0%, #dff1fb 100%); }
    
    /* 3D Hotspot Species Labels — Anti-Collision Styling */
    .species-hotspot {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 2px solid #632ce5;
      border-radius: 18px;
      padding: 6px 14px;
      box-shadow: 0 8px 24px rgba(99, 44, 229, 0.18);
      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #0d1e25;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s ease;
      white-space: nowrap;
      user-select: none;
      z-index: 10;
    }
    .species-hotspot:hover {
      transform: scale(1.1);
      border-color: #632ce5;
      background: #632ce5;
      color: #ffffff;
    }
    .species-role-badge {
      background: #fdd400;
      color: #0d1e25;
      font-size: 10px;
      font-weight: 900;
      padding: 2.5px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Floating Clean Card HUD */
    .hud-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border: 1.5px solid #d4e5ef;
      box-shadow: 0 12px 32px -4px rgba(99, 44, 229, 0.12);
      color: #0d1e25;
    }

    /* Modern Chunky Button */
    .chunky-btn {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .chunky-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="w-screen h-screen relative select-none">

  <!-- TOP NAVIGATION HEADER & 2-MODE SWITCHER (3D View vs Mode AR) -->
  <header class="absolute top-4 left-4 right-4 z-30 pointer-events-auto">
    <div class="max-w-4xl mx-auto hud-card p-3 sm:p-3.5 rounded-3xl flex flex-wrap items-center justify-between gap-3 shadow-xl">
      
      <!-- Left Brand Info with Logo -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#632ce5] to-[#7c4dff] text-white shadow-md flex items-center justify-center flex-shrink-0">
          <img src="/assets/logo/logo-putih.svg" alt="AlamVerse Logo" class="w-7 h-7 object-contain select-none"/>
        </div>
        <div>
          <h1 class="font-extrabold text-on-surface text-base sm:text-lg leading-tight flex items-center gap-2">
            <span>{{ECOSYSTEM_NAME}}</span>
            <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-primary/10 text-primary font-black border border-primary/20">SD Edu</span>
          </h1>
          <p class="text-xs text-on-surface/70 font-bold flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Ring Siklus Rantai Makanan 360°
          </p>
        </div>
      </div>

      <!-- Right Mode Viewing Selector (2 Modes: 3D View vs AR) -->
      <div class="flex items-center gap-1.5 bg-[#f4f7fc] p-1.5 rounded-2xl border border-[#d4e5ef]">
        <button id="btn-mode-3d" onclick="switchViewMode('3d')" class="chunky-btn px-4 py-2 rounded-xl text-xs font-black bg-[#632ce5] text-white transition-all flex items-center gap-1.5 shadow-sm">
          <span class="material-symbols-outlined text-base">3d_rotation</span> 3D View
        </button>
        <button id="btn-mode-ar" onclick="switchViewMode('ar')" class="chunky-btn px-4 py-2 rounded-xl text-xs font-bold text-on-surface/70 hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
          <span class="material-symbols-outlined text-base">view_in_ar</span> Mode AR (Marker Kartu)
        </button>
      </div>

    </div>
  </header>

  <!-- SUB-HEADER: CIRCULAR TEXT BANNER -->
  <div id="circular-text-hud" class="absolute top-24 sm:top-20 left-1/2 -translate-x-1/2 z-20 pointer-events-auto">
    <div class="bg-amber-400 border-2 border-amber-300 text-slate-950 text-xs font-black px-5 py-2 rounded-full flex items-center gap-2 shadow-lg animate-pulse">
      <span class="material-symbols-outlined text-base text-slate-950">autorenew</span>
      <span id="circular-text-banner" class="tracking-wide">🔄 PRODUSEN ➔ KONSUMEN I ➔ KONSUMEN II ➔ KONSUMEN III ➔ PENGURAI</span>
    </div>
  </div>

  <!-- Mode 1: Google <model-viewer> 3D Engine with Instant Auto-Rotate -->
  <model-viewer
    id="eco-viewer"
    src="{{ECOSYSTEM_GLB_URL}}"
    camera-controls
    camera-orbit="30deg 60deg 7.5m"
    shadow-intensity="1.5"
    shadow-softness="0.8"
    alt="{{ECOSYSTEM_NAME}}"
    loading="eager"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="20deg"
  >
    <!-- Slot 0 Hotspot: Produsen -->
    <button slot="hotspot-0" class="species-hotspot" data-position="2.65 1.35 0" data-normal="0 1 0">
      <span>{{SLOT_0_LABEL}}</span>
      <span class="species-role-badge">{{SLOT_0_ROLE}}</span>
    </button>

    <!-- Slot 1 Hotspot: Konsumen I -->
    <button slot="hotspot-1" class="species-hotspot" data-position="1.32 1.45 2.29" data-normal="0 1 0">
      <span>{{SLOT_1_LABEL}}</span>
      <span class="species-role-badge">{{SLOT_1_ROLE}}</span>
    </button>

    <!-- Slot 2 Hotspot: Konsumen II -->
    <button slot="hotspot-2" class="species-hotspot" data-position="-1.32 1.35 2.29" data-normal="0 1 0">
      <span>{{SLOT_2_LABEL}}</span>
      <span class="species-role-badge">{{SLOT_2_ROLE}}</span>
    </button>

    <!-- Slot 3 Hotspot: Konsumen III -->
    <button slot="hotspot-3" class="species-hotspot" data-position="-2.65 1.45 0" data-normal="0 1 0">
      <span>{{SLOT_3_LABEL}}</span>
      <span class="species-role-badge">{{SLOT_3_ROLE}}</span>
    </button>

    <!-- Slot 4 Hotspot: Konsumen Final -->
    <button slot="hotspot-4" class="species-hotspot" data-position="-1.32 1.35 -2.29" data-normal="0 1 0">
      <span>{{SLOT_4_LABEL}}</span>
      <span class="species-role-badge">{{SLOT_4_ROLE}}</span>
    </button>

    <!-- Slot 5 Hotspot: Decomposer -->
    <button slot="hotspot-5" class="species-hotspot" data-position="1.32 1.45 -2.29" data-normal="0 1 0">
      <span>{{SLOT_5_LABEL}}</span>
      <span class="species-role-badge">{{SLOT_5_ROLE}}</span>
    </button>

    <!-- Center Ring Hotspot Badge -->
    <button slot="hotspot-center" class="species-hotspot" data-position="0 2.6 0" data-normal="0 1 0" style="border-color: #705d00; background: #ffe170; color: #0d1e25;">
      <span class="material-symbols-outlined text-secondary text-base">cyclone</span>
      <span class="font-extrabold">RANTAI MAKANAN 360°</span>
    </button>
  </model-viewer>

  <!-- Mode 2: MindAR.js Fullscreen Camera Tracking Container -->
  <div id="mindar-container" class="hidden fixed inset-0 z-10 w-full h-full bg-slate-950 overflow-hidden">
    <!-- Top Status HUD -->
    <div class="absolute top-24 sm:top-20 left-1/2 -translate-x-1/2 z-30 pointer-events-auto">
      <div class="hud-card px-5 py-2.5 rounded-full flex items-center gap-3 shadow-2xl text-xs font-black">
        <span id="mindar-status-dot" class="w-3 h-3 rounded-full bg-amber-400"></span>
        <span id="mindar-status-text" class="text-on-surface">Arahkan kamera ke Kartu Print AR...</span>
      </div>
    </div>

    <!-- Target Alignment Frame Overlay -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
      <div class="w-72 h-96 border-4 border-dashed border-amber-400/80 rounded-3xl flex flex-col items-center justify-between p-6 animate-pulse">
        <span class="text-xs font-extrabold text-white bg-purple-700/90 px-3.5 py-1 rounded-full shadow">Scan Kartu Print AR</span>
        <span class="material-symbols-outlined text-5xl text-amber-300">qr_code_scanner</span>
        <span class="text-[11px] text-white/90 font-bold bg-slate-900/80 px-2.5 py-1 rounded-lg">MindAR Cross-Device Engine</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM FLOATING HUD: ROTATION CONTROLS -->
  <div id="bottom-controls-hud" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 pointer-events-auto w-full max-w-md px-4">
    <div class="hud-card p-4 rounded-3xl space-y-3 shadow-2xl">
      
      <!-- Row: Rotational Controls -->
      <div class="flex items-center justify-between gap-2 text-xs font-bold text-on-surface">
        <button onclick="toggleRotation()" id="btn-toggle-rotation" class="chunky-btn px-4 py-2 rounded-xl bg-purple-100 hover:bg-purple-200 text-primary font-extrabold flex items-center gap-1.5 transition-colors">
          <span id="rot-icon" class="material-symbols-outlined text-base">pause_circle</span>
          <span id="rot-text">Hentikan Putaran</span>
        </button>

        <button onclick="reverseRotation()" class="chunky-btn px-3.5 py-2 rounded-xl bg-surface-container hover:bg-surface-variant text-on-surface font-extrabold flex items-center gap-1.5 transition-colors" title="Balik Arah Rotasi">
          <span class="material-symbols-outlined text-base">screen_rotation</span> Arah
        </button>

        <div class="flex items-center gap-1.5 bg-[#f4f7fc] px-3 py-1.5 rounded-xl border border-[#d4e5ef]">
          <span class="text-[11px] text-outline font-semibold">Kecepatan:</span>
          <select onchange="changeSpeed(this.value)" class="bg-transparent text-xs font-extrabold text-primary outline-none cursor-pointer p-0 border-none focus:ring-0">
            <option value="10deg">Lambat</option>
            <option value="20deg" selected>Normal</option>
            <option value="45deg">Cepat</option>
          </select>
        </div>
      </div>

    </div>
  </div>

  <!-- Clean Single Script Block with MindAR.js & Auto-Rotate Triggers -->
  <script>
    const viewer = document.getElementById('eco-viewer');
    let isRotating = true;
    let rotationSpeed = '20deg';
    let isReversed = false;
    let mindarThree = null;
    let arModelObj = null;

    // ─── Force Instant Auto-Rotate on Initial Page Load ──────────
    function forceStartAutoRotate() {
      if (isRotating && viewer) {
        viewer.setAttribute('auto-rotate', '');
        viewer.setAttribute('auto-rotate-delay', '0');
        let numericSpeed = parseInt(rotationSpeed) || 20;
        if (isReversed) numericSpeed = -Math.abs(numericSpeed);
        else numericSpeed = Math.abs(numericSpeed);
        viewer.setAttribute('rotation-per-second', `${numericSpeed}deg`);
      }
    }

    // Bind instant rotation triggers across lifecycle
    window.addEventListener('DOMContentLoaded', forceStartAutoRotate);
    if (viewer) {
      viewer.addEventListener('load', forceStartAutoRotate);
      viewer.addEventListener('poster-dismissed', forceStartAutoRotate);
      viewer.addEventListener('load-error', (e) => console.warn('Model load warning:', e));
    }

    // ─── Rotation Control Handlers ────────────────────────────
    function toggleRotation() {
      const btnText = document.getElementById('rot-text');
      const btnIcon = document.getElementById('rot-icon');
      if (isRotating) {
        viewer.removeAttribute('auto-rotate');
        isRotating = false;
        if (btnText) btnText.innerText = 'Mulai Putaran';
        if (btnIcon) btnIcon.innerText = 'play_circle';
      } else {
        viewer.setAttribute('auto-rotate', '');
        viewer.setAttribute('auto-rotate-delay', '0');
        isRotating = true;
        if (btnText) btnText.innerText = 'Hentikan Putaran';
        if (btnIcon) btnIcon.innerText = 'pause_circle';
        forceStartAutoRotate();
      }
    }

    function reverseRotation() {
      isReversed = !isReversed;
      forceStartAutoRotate();
    }

    function changeSpeed(val) {
      rotationSpeed = val;
      forceStartAutoRotate();
    }

    // ─── MindAR.js Cross-Device Marker Tracking Controller ───
    async function startMindAR() {
      const container = document.getElementById('mindar-container');
      if (!container) return;
      container.classList.remove('hidden');

      if (viewer) viewer.style.display = 'none';

      const statusText = document.getElementById('mindar-status-text');
      const statusDot = document.getElementById('mindar-status-dot');

      if (statusText) statusText.innerText = 'Memulai Kamera AR (MindAR)...';

      try {
        const assetId = '{{ECOSYSTEM_ID}}' || 'preset-darat';
        const targetMindPath = `/assets/markers/${assetId}.mind`;

        mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: container,
          imageTargetSrc: targetMindPath,
          uiLoading: "no",
          uiScanning: "no",
          uiError: "no"
        });

        const { renderer, scene, camera } = mindarThree;
        const anchor = mindarThree.addAnchor(0);

        // Ambient & Directional Lights for GLB rendering
        const ambLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(2, 6, 4);
        scene.add(dirLight);

        // Load EXACT SAME GLB 3D MODEL
        const gltfUrl = '{{ECOSYSTEM_GLB_URL}}';
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load(gltfUrl, (gltf) => {
          arModelObj = gltf.scene;
          arModelObj.scale.set(0.32, 0.32, 0.32);
          arModelObj.position.set(0, 0, 0);
          anchor.group.add(arModelObj);
        });

        anchor.onTargetFound = () => {
          if (statusText) statusText.innerText = '● Marker Terdeteksi! Objek AR Aktif';
          if (statusDot) statusDot.className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse';
        };

        anchor.onTargetLost = () => {
          if (statusText) statusText.innerText = '○ Arahkan kamera ke Kartu Print AR...';
          if (statusDot) statusDot.className = 'w-3 h-3 rounded-full bg-amber-400';
        };

        await mindarThree.start();
        renderer.setAnimationLoop(() => {
          if (arModelObj) {
            arModelObj.rotation.y += 0.005; // Gentle rotation on card
          }
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error("MindAR Error:", err);
        if (statusText) statusText.innerText = 'Gagal mengakses kamera. Izinkan akses kamera pada browser.';
      }
    }

    function stopMindAR() {
      if (mindarThree) {
        try { mindarThree.stop(); } catch(e) {}
        mindarThree = null;
      }
      const container = document.getElementById('mindar-container');
      if (container) container.classList.add('hidden');

      if (viewer) viewer.style.display = 'block';
    }

    // ─── 2 Mode Selector (3D View vs Mode AR) ─────────────────
    function switchViewMode(mode) {
      const btn3D = document.getElementById('btn-mode-3d');
      const btnAR = document.getElementById('btn-mode-ar');
      const btmControls = document.getElementById('bottom-controls-hud');

      if (mode === 'ar') {
        if (btn3D) btn3D.className = "chunky-btn px-4 py-2 rounded-xl text-xs font-bold text-on-surface/70 hover:text-primary hover:bg-white transition-all flex items-center gap-1.5";
        if (btnAR) btnAR.className = "chunky-btn px-4 py-2 rounded-xl text-xs font-black bg-[#632ce5] text-white transition-all flex items-center gap-1.5 shadow-sm";
        if (btmControls) btmControls.classList.add('hidden');
        startMindAR();
      } else {
        if (btn3D) btn3D.className = "chunky-btn px-4 py-2 rounded-xl text-xs font-black bg-[#632ce5] text-white transition-all flex items-center gap-1.5 shadow-sm";
        if (btnAR) btnAR.className = "chunky-btn px-4 py-2 rounded-xl text-xs font-bold text-on-surface/70 hover:text-primary hover:bg-white transition-all flex items-center gap-1.5";
        if (btmControls) btmControls.classList.remove('hidden');
        stopMindAR();
      }
    }
  </script>
</body>
</html>
