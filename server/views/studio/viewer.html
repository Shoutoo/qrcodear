<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Studio Multi-Object Viewer — {{SCENE_NAME}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <style>
    body { font-family: 'Quicksand', sans-serif; margin: 0; overflow: hidden; background: #000; }
    #ar-canvas-container { width: 100vw; height: 100vh; position: absolute; inset: 0; }
    .ar-pill-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white; font-weight: 700; font-size: 14px;
      padding: 14px 28px; border-radius: 50px; border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 10px 30px rgba(5, 150, 105, 0.4);
      display: flex; items-center: center; gap: 8px; cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .ar-pill-btn:active { transform: scale(0.95); }
  </style>

  <!-- WebXR Polyfill for iOS / Browsers without native WebXR -->
  <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.min.js"></script>
  <script>
    if (typeof WebXRPolyfill !== 'undefined') {
      new WebXRPolyfill();
    }
  </script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <!-- Three.js & WebXR loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

  <!-- 3D Canvas -->
  <div id="ar-canvas-container"></div>

  <!-- Overlay UI -->
  <div id="overlay-ui" class="fixed inset-0 pointer-events-none z-20 flex flex-col justify-between p-6">
    
    <!-- Top Header Bar -->
    <div class="flex items-center justify-between pointer-events-auto">
      <div class="bg-white/90 backdrop-blur-md px-4 py-2 rounded-2xl border border-slate-200 shadow-lg flex items-center gap-2.5">
        <span class="material-symbols-outlined text-emerald-600">view_in_ar</span>
        <div>
          <h1 class="font-bold text-slate-800 text-sm leading-tight">{{SCENE_NAME}}</h1>
          <p class="text-[10px] text-slate-500 font-semibold">WebXR Tap-to-Place AR</p>
        </div>
      </div>

      <a href="/studio" class="bg-white/90 backdrop-blur-md hover:bg-slate-100 text-slate-700 p-2.5 rounded-2xl border border-slate-200 shadow-lg transition-colors">
        <span class="material-symbols-outlined text-sm">close</span>
      </a>
    </div>

    <!-- Instruction Badge & Start AR Button (Center Bottom) -->
    <div class="flex flex-col items-center gap-3 pointer-events-auto mb-6">
      
      <!-- Tap Instruction Banner -->
      <div id="tap-instruction" class="bg-slate-900/90 backdrop-blur-md text-white border border-white/20 px-5 py-2.5 rounded-full text-xs font-bold shadow-2xl flex items-center gap-2 transition-all">
        <span class="material-symbols-outlined text-emerald-400 text-sm animate-bounce">touch_app</span>
        <span id="instruction-text">Tekan "Lihat dalam AR" untuk memulai scan ruangan</span>
      </div>

      <!-- Start AR Button -->
      <button id="start-ar-btn" class="ar-pill-btn">
        <span class="material-symbols-outlined text-lg">view_in_ar</span> Lihat dalam AR
      </button>

    </div>
  </div>

  <script type="application/json" id="scene-json-data">
  {{SCENE_DATA_JSON}}
  </script>

  <script>
    const SCENE_DATA = JSON.parse(document.getElementById('scene-json-data').textContent || '{}');
    const objects = SCENE_DATA.objects || [];

    let container, camera, scene, renderer;
    let controller, reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let sceneGroup; // Root group containing all multi-objects
    let isPlaced = false;
    let gltfLoader, textureLoader;

    function init() {
      container = document.getElementById('ar-canvas-container');

      // 1. Three.js Scene
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(2, 4, 2);
      scene.add(dirLight);

      // 2. Scene Root Group for Multi-Objects
      sceneGroup = new THREE.Group();
      sceneGroup.visible = false; // Hidden until user taps floor reticle
      scene.add(sceneGroup);

      // 3. Setup Loaders
      textureLoader = new THREE.TextureLoader();
      gltfLoader = new THREE.GLTFLoader();
      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader.setDRACOLoader(dracoLoader);

      // Populate objects into sceneGroup
      buildSceneObjects();

      // 4. Reticle Ring for Floor Hit-Testing
      const ringGeo = new THREE.RingGeometry(0.15, 0.18, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // 5. Renderer & WebXR setup
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      // 6. Setup WebXR AR Button Listener
      setupARButton();

      window.addEventListener('resize', onWindowResize);
    }

    function buildSceneObjects() {
      if (!objects || !objects.length) {
        // Fallback demo shape if no objects in scene
        const defaultGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const defaultMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
        sceneGroup.add(new THREE.Mesh(defaultGeo, defaultMat));
        return;
      }

      objects.forEach(obj => {
        const itemGroup = new THREE.Group();
        if (obj.position) itemGroup.position.set(obj.position[0] || 0, obj.position[1] || 0, obj.position[2] || 0);
        if (obj.rotation) itemGroup.rotation.set(obj.rotation[0] || 0, obj.rotation[1] || 0, obj.rotation[2] || 0);
        if (obj.scale) itemGroup.scale.set(obj.scale[0] || 1, obj.scale[1] || 1, obj.scale[2] || 1);

        const modelPath = obj.src || obj.url || (obj.assetData ? `/assets/${obj.assetData.filename}` : null);

        if (obj.type === 'model' && modelPath) {
          gltfLoader.load(modelPath, (gltf) => {
            const model = gltf.scene;
            const box = new THREE.Box3().setFromObject(model);
            if (!box.isEmpty()) {
              // Shift model so its lowest Y point sits flat at Y = 0
              model.position.y -= box.min.y;
            }
            itemGroup.add(model);
          }, undefined, (err) => {
            console.error('Error loading 3D model in AR:', err);
          });
        } else if (obj.type === 'shape') {
          let geo, mat;
          const color = obj.color || 0x10b981;
          mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, side: THREE.DoubleSide });

          if (obj.shapeType === 'box') {
            geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            geo.translate(0, 0.25, 0); // Ground bottom at Y = 0
          } else if (obj.shapeType === 'sphere') {
            geo = new THREE.SphereGeometry(0.35, 32, 32);
            geo.translate(0, 0.35, 0);
          } else if (obj.shapeType === 'cylinder') {
            geo = new THREE.CylinderGeometry(0.25, 0.25, 0.75, 32);
            geo.translate(0, 0.375, 0);
          } else {
            geo = new THREE.PlaneGeometry(0.8, 0.8);
            geo.translate(0, 0.4, 0);
          }

          const mesh = new THREE.Mesh(geo, mat);
          itemGroup.add(mesh);
        } else if (obj.type === 'image' && (obj.url || obj.src)) {
          textureLoader.load(obj.url || obj.src, (tex) => {
            const aspect = (tex.image.width && tex.image.height) ? (tex.image.width / tex.image.height) : 1;
            const geo = new THREE.PlaneGeometry(aspect * 0.8, 0.8);
            geo.translate(0, 0.4, 0);
            const mat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide, transparent: true });
            const mesh = new THREE.Mesh(geo, mat);
            itemGroup.add(mesh);
          });
        } else if (obj.type === 'text') {
          const canvas = document.createElement('canvas');
          canvas.width = 512; canvas.height = 128;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = obj.color || '#10b981';
          ctx.font = 'Bold 48px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(obj.content || obj.name || 'Text 3D', 256, 75);

          const textTex = new THREE.CanvasTexture(canvas);
          const textGeo = new THREE.PlaneGeometry(1.2, 0.3);
          textGeo.translate(0, 0.15, 0);
          const textMat = new THREE.MeshBasicMaterial({ map: textTex, transparent: true, side: THREE.DoubleSide });
          itemGroup.add(new THREE.Mesh(textGeo, textMat));
        }

        sceneGroup.add(itemGroup);
      });
    }

    let lastValidMatrix = new THREE.Matrix4();
    let hasValidHit = false;

    async function setupARButton() {
      const arBtn = document.getElementById('start-ar-btn');
      const instructionText = document.getElementById('instruction-text');

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      let isWebXRSupported = false;

      if (navigator.xr && navigator.xr.isSessionSupported) {
        try {
          isWebXRSupported = await navigator.xr.isSessionSupported('immersive-ar');
        } catch (e) {
          isWebXRSupported = false;
        }
      }

      // Find first 3D model GLB in scene for iOS Quick Look fallback
      const firstModelObj = objects.find(o => o.type === 'model' && objSrc(o));
      const modelUrl = firstModelObj ? objSrc(firstModelObj) : '/assets/draco_test.glb';

      function objSrc(o) { return o.src || (o.assetData ? `/assets/${o.assetData.filename}` : null); }

      if (isWebXRSupported) {
        instructionText.textContent = 'Tekan "Lihat dalam AR" untuk memindai ruangan';
        arBtn.addEventListener('click', async () => {
          try {
            const session = await navigator.xr.requestSession('immersive-ar', {
              requiredFeatures: ['hit-test'],
              optionalFeatures: ['dom-overlay', 'local-floor'],
              domOverlay: { root: document.getElementById('overlay-ui') }
            });
            onSessionStarted(session);
          } catch (err) {
            console.error('Failed to start AR session:', err);
            instructionText.textContent = 'AR Error: ' + err.message;
          }
        });
      } else {
        // iOS Safari or non-WebXR Browser Fallback
        instructionText.textContent = isIOS ? 'iOS Safari: Buka AR Quick Look' : 'Buka AR Quick Look Viewer';
        arBtn.innerHTML = '<span class="material-symbols-outlined text-lg">phone_iphone</span> Lihat AR (iOS Quick Look)';

        // Prepare hidden <model-viewer> element for iOS Quick Look
        let mv = document.getElementById('ios-ar-viewer');
        if (!mv) {
          mv = document.createElement('model-viewer');
          mv.id = 'ios-ar-viewer';
          mv.setAttribute('src', modelUrl);
          mv.setAttribute('ar', '');
          mv.setAttribute('ar-modes', 'quicklook scene-viewer webxr');
          mv.setAttribute('camera-controls', '');
          mv.style.display = 'none';
          document.body.appendChild(mv);
        }

        arBtn.addEventListener('click', () => {
          if (mv && typeof mv.activateAR === 'function') {
            mv.activateAR();
          } else {
            const arLink = mv.shadowRoot ? mv.shadowRoot.querySelector('#ar-button') : null;
            if (arLink) arLink.click();
            else alert('Silakan gunakan Chrome (Android) untuk WebXR Tap-to-Place atau update iOS Safari.');
          }
        });
      }
    }

    async function onSessionStarted(session) {
      document.getElementById('start-ar-btn').style.display = 'none';
      document.getElementById('instruction-text').textContent = 'Arahkan kamera ke permukaan meja/lantai lalu tap layar';

      // Try local-floor for real-world floor tracking, fallback to local
      try {
        await renderer.xr.setReferenceSpaceType('local-floor');
      } catch (e) {
        await renderer.xr.setReferenceSpaceType('local');
      }

      renderer.xr.setSession(session);

      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      // Window tap fallback listener for WebXR
      window.addEventListener('click', onWindowTap);
      window.addEventListener('touchstart', onWindowTap);

      session.addEventListener('end', onSessionEnded);

      renderer.setAnimationLoop(render);
    }

    function onSessionEnded() {
      hitTestSourceRequested = false;
      hitTestSource = null;
      hasValidHit = false;
      window.removeEventListener('click', onWindowTap);
      window.removeEventListener('touchstart', onWindowTap);
      document.getElementById('start-ar-btn').style.display = 'flex';
      document.getElementById('instruction-text').textContent = 'Tekan "Lihat dalam AR" untuk memulai';
    }

    function onWindowTap() {
      if (renderer.xr.isPresenting && !isPlaced) {
        onSelect();
      }
    }

    function onSelect() {
      if (isPlaced) return;

      if (hasValidHit || (reticle && reticle.visible)) {
        const hitPos = new THREE.Vector3();
        hitPos.setFromMatrixPosition(reticle.matrix.elements[0] ? reticle.matrix : lastValidMatrix);

        // Lock sceneGroup at exact 3D world position
        sceneGroup.position.copy(hitPos);

        // Turn scene to face user camera upright in world space
        const camPos = new THREE.Vector3();
        camera.getWorldPosition(camPos);
        sceneGroup.lookAt(camPos.x, sceneGroup.position.y, camPos.z);

        sceneGroup.visible = true;
        isPlaced = true;
        if (reticle) reticle.visible = false;

        const instr = document.getElementById('instruction-text');
        if (instr) instr.textContent = '✨ Scene terkunci di posisi 3D nyata! Anda dapat berjalan keliling 360°.';
      } else {
        const instr = document.getElementById('instruction-text');
        if (instr) instr.textContent = 'Gerakkan kamera perlahan untuk memindai lantai/meja...';
      }
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (hitTestSourceRequested === false) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            hasValidHit = false;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource && !isPlaced) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            lastValidMatrix.fromArray(pose.transform.matrix);
            hasValidHit = true;
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
